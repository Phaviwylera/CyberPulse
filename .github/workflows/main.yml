name: Daily Post Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      - name: Run Daily Post Generator
        run: python ./.github/workflows/daily_post_generator.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}

      - name: Commit and push new post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: publish daily dispatch + rebuild site"
          branch: main
          # Everything the builder emits, nothing else.
          file_pattern: >-
            *.html blog/*.html blog-index.json sitemap.xml feed.xml robots.txt
            assets/site.webmanifest content/*.json
